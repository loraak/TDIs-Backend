# Configuración común. Lo que cambia entre local y producción está en:
#   application-dev.yml  -> local (perfil por defecto)
#   application-prod.yml -> producción (activar con SPRING_PROFILES_ACTIVE=prod)
server:
  port: ${PORT:8083}

spring:
  application:
    name: tramites-service
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  web:
    error:
      include-message: always
      include-binding-errors: always
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 10000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${RAILWAY_PRIVATE_DOMAIN:localhost}
    instance-id: ${spring.application.name}:${random.value}

# Vacío = sin IA: las evidencias quedan en "Requiere revisión" para el admin.
n8n:
  webhook:
    url: ${N8N_WEBHOOK_URL:}
