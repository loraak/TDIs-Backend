# Configuración común. Lo que cambia entre local y producción está en:
#   application-dev.yml  -> local (perfil por defecto)
#   application-prod.yml -> producción (activar con SPRING_PROFILES_ACTIVE=prod)
server:
  port: ${PORT:8083}

spring:
  application:
    name: tramites-service
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  web:
    error:
      include-message: always
      include-binding-errors: always
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 10000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${RAILWAY_PRIVATE_DOMAIN:localhost}
    instance-id: ${spring.application.name}:${random.value}

# ---------- Análisis de evidencias con IA ----------
tdis:
  ia:
    # ninguno (todo lo revisa el admin) | gemini | n8n
    proveedor: ${IA_PROVEEDOR:ninguno}
    # recomendar: la IA solo opina, el admin decide
    # automatico: la IA aprueba/rechaza sola si su confianza >= confianza-minima
    modo: ${IA_MODO:recomendar}
    confianza-minima: ${IA_CONFIANZA_MINIMA:0.85}
    gemini:
      modelo: ${GEMINI_MODELO:gemini-3.1-flash-lite}
      ubicacion: ${GEMINI_UBICACION:global}
      # En Cloud Run: ID del proyecto (usa Vertex AI con la cuenta de servicio)
      proyecto: ${GCP_PROJECT_ID:}
      # Solo para probar en local con una key de AI Studio
      api-key: ${GEMINI_API_KEY:}

# Solo si proveedor = n8n
n8n:
  webhook:
    url: ${N8N_WEBHOOK_URL:}
