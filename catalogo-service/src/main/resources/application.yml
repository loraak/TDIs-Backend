# Configuración común. Lo que cambia entre local y producción está en:
#   application-dev.yml  -> local (perfil por defecto)
#   application-prod.yml -> producción (activar con SPRING_PROFILES_ACTIVE=prod)
server:
  port: ${PORT:8082}

spring:
  application:
    name: catalogo-service
  profiles:
    default: dev
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${RAILWAY_PRIVATE_DOMAIN:localhost}
    instance-id: ${spring.application.name}:${random.value}
